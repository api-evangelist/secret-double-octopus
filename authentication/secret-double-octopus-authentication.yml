authorization:
  model: role-based, resource+method ACL
  description: >-
    Console roles are scoped with JSON rules of the form
    {"resource": "<REST API URL>", "methods": ["<Method1>", "<Method2>"], "action": "<allow/deny>"},
    where the resource string is only the portion of the URL following <URL>:<port>/api/. The
    permissible resource/method pairs are enumerated on the deployment's own REST API reference at
    <URL>:<port>/docs/.
