aid: secret-double-octopus
name: Secret Double Octopus
description: 'Secret Double Octopus (SDO) is an enterprise workforce authentication vendor whose Octopus
  Authentication Platform uses patented ZeroPassword technology to eliminate all user-managed passwords
  and deliver phishing-resistant, passwordless MFA across legacy, on-premises, cloud, and air-gapped
  systems. The platform covers SaaS and web apps, VPN, RDP, VDI/Citrix, Linux SSH, shared workstations,
  servers and domain-joined desktops, and integrates with existing identity infrastructure — Active
  Directory, Microsoft Entra ID and Okta — without redesign. Any authenticator is supported: mobile push,
  biometrics, FIDO2 security keys, X.509 smart cards, Windows Hello and OTP tokens. SDO ships an Octopus
  Management Console REST API for system control, scripting, bulk updates and IDM integration (SailPoint
  and similar), but that API is served from the customer''s own deployed Management Console and its
  reference is not published on a public developer portal.'
