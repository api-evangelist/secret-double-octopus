    updates, and integration with identity management solutions like SailPoint." The API is served by
    each customer''s own deployed Management Console — endpoints live under <console-host>:<port>/api/
    and the interactive API reference is served at <console-host>:<port>/docs/ inside that deployment.
    There is no vendor-hosted API host and no publicly published machine-readable specification.'
